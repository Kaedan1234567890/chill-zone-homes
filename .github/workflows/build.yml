name: Build Chill Zone Homes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build mod
        run: gradle clean build --stacktrace
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: chill-zone-homes
          path: build/libs/chill-zone-homes-*.jar
          if-no-files-found: error
